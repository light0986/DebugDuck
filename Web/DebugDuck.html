<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DebugDuck</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      background: #ffffff;
      color: #2c2a24;
    }

    /* 鴨子：畫面中間下方、往上 50px，固定不能拖 */
    #duck {
      position: fixed;
      left: 50%;
      bottom: 50px;
      transform: translateX(-50%);
      width: 120px;
      z-index: 10;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    /* 分層套變形：外層上下起伏，內層 Q 彈壓扁 */
    #duck .bob { display: block; }
    #duck .scale { display: block; transform-origin: 50% 82%; }
    #duck img {
      width: 100%;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.18));
    }

    /* 聊天室：可捲動的歷史紀錄（Web 版才有） */
    #chatPanel {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: 10px;              /* 離頂部 10px，高度由 top / bottom 撐開 */
      width: min(320px, calc(100vw - 20px));   /* 最大 320，隨視窗縮，左右各留 ≥10px */
      background: #ffffff;
      border: 1px solid #e6e6e6;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      z-index: 20;
    }
    #chatPanel .log {
      height: 100%;
      overflow-y: scroll;             /* 捲軸一直顯示 */
      scrollbar-gutter: stable;
      scrollbar-width: thin;                        /* Firefox */
      scrollbar-color: #cfd4da #f1f2f4;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #chatPanel .log::-webkit-scrollbar { width: 8px; }
    #chatPanel .log::-webkit-scrollbar-track { background: #f1f2f4; border-radius: 8px; }
    #chatPanel .log::-webkit-scrollbar-thumb { background: #cfd4da; border-radius: 8px; }

    /* 一則訊息 = 泡泡 + 底下的時間戳記 */
    .msg-wrap { display: flex; flex-direction: column; max-width: 82%; }
    .msg-wrap.player { align-self: flex-end; align-items: flex-end; }
    .msg-wrap.duck { align-self: flex-start; align-items: flex-start; }
    .msg-wrap.thinking .msg { opacity: 0.7; font-style: italic; }

    .msg {
      padding: 8px 11px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-wrap.player .msg { background: #CDF5CD; color: #12521A; }
    .msg-wrap.duck .msg { background: #CDE8FF; color: #0B3D91; }

    .msg-time {
      font-size: 9px;                 /* 比之前更小 */
      color: #b3b7bd;
      margin-top: 2px;
      padding: 0 3px;
    }

    /* 輸入框：樣式對齊 WPF 的 InputArea（圓角淡白底 + 綠色「說」鈕） */
    #chatInput {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;          /* 內容縱向置中 */
      width: min(320px, calc(100vw - 20px));   /* 最大 320，隨視窗縮，左右各留 ≥10px */
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      padding: 4px 6px;             /* 扁一點 */
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
      z-index: 20;
    }
    #chatInput textarea {
      flex: 1;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      font: inherit;
      font-size: 13px;
      height: 24px;                 /* 比文字大一點點 */
      line-height: 24px;            /* 單行文字縱向置中 */
      padding: 0 4px;
      max-height: 72px;
      overflow-y: auto;
    }
    #chatInput button {
      border: 1px solid #8BD48B;
      background: #CDF5CD;
      color: #12521A;
      font: inherit;
      font-weight: 600;
      font-size: 13px;
      border-radius: 8px;
      padding: 4px 14px;
      cursor: pointer;
    }
    #chatInput button:disabled { cursor: default; }
    #chatInput.busy { opacity: 0.5; }

    /* 頁尾：左下角小字「關於」，右下角 20px 的 light0986.ico */
    #aboutText {
      position: fixed;
      left: 10px;
      bottom: 8px;
      font-size: 11px;
      color: #9aa0a6;
      user-select: none;
      z-index: 5;
    }
    #aboutIcon {
      position: fixed;
      right: 10px;
      bottom: 8px;
      width: 20px;
      height: 20px;
      z-index: 5;
    }
  </style>

<body>

  <div id="chatPanel">
    <div class="log" id="chatLog"></div>
  </div>

  <div id="chatInput">
    <textarea id="chatText" rows="1" placeholder="把你的 bug 講給鴨子聽…"></textarea>
    <button id="chatSend" type="button">說</button>
  </div>

  <div id="duck">
    <div class="bob">
      <div class="scale">
        <img alt="小黃鴨" draggable="false">
      </div>
    </div>
  </div>

  <div id="aboutText">作者: light0986</div>
  <img id="aboutIcon" alt="light0986">

  <script>
    'use strict';

    const duck = document.getElementById('duck');
    const bobEl = duck.querySelector('.bob');
    const scaleEl = duck.querySelector('.scale');
    duck.querySelector('img').src = ASSETS.duck;
    document.getElementById('aboutIcon').src = ASSETS.author;

    // 上下輕微起伏（對應 WPF 的 HostBob：0 → -3px，1.2s 單程，來回不間斷）
    bobEl.animate(
      [
        { transform: 'translateY(0)' },
        { transform: 'translateY(-3px)' },
        { transform: 'translateY(0)' },
      ],
      { duration: 2400, iterations: Infinity, easing: 'ease-in-out' },
    );

    // 左鍵按一下 → Q 彈壓扁（對應 WPF 的 Squash：0.5s，最多縮到 0.9，彈回時 overshoot）
    let squashing = false;
    duck.addEventListener('click', () => {
      if (squashing) return;
      squashing = true;

      playQuacks(1);   // 點一下也叫一聲（對應 WPF Squash 裡的 DuckSound.Play(1)）

      const anim = scaleEl.animate(
        [
          { transform: 'scale(1, 1)', offset: 0 },
          { transform: 'scale(1.08, 0.90)', offset: 0.24, easing: 'ease-out' },
          { transform: 'scale(0.98, 1.03)', offset: 0.55 },
          { transform: 'scale(1.01, 0.99)', offset: 0.78 },
          { transform: 'scale(1, 1)', offset: 1 },
        ],
        { duration: 500, easing: 'ease-in-out' },
      );

      const done = () => { squashing = false; };
      anim.addEventListener('finish', done);
      anim.addEventListener('cancel', done);
      setTimeout(done, 550);   // 保險：分頁切到背景時 WAAPI 會暫停，finish 不會觸發
    });

    // ============ 叫聲（對應 DuckSound.cs：按字數叫幾聲，間距固定） ============

    const QUACK_STAGGER = 250;   // 每聲間距，固定（對應 WPF 的 QuackStagger）
    const QUACK_VOLUME = 0.5;    // 對應 WPF 的 DuckSound.Volume

    let audioCtx = null;
    let quackBuf = null;
    let quackLoading = null;

    function initSound() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        quackLoading = fetch(ASSETS.quack)
          .then((r) => r.arrayBuffer())
          .then((ab) => audioCtx.decodeAudioData(ab))
          .then((buf) => { quackBuf = buf; })
          .catch(() => {});
      } catch {
        audioCtx = null;
      }
    }
    // 第一個手勢就把音訊解鎖
    window.addEventListener('pointerdown', initSound, { once: true });

    function playQuacks(times) {
      initSound();
      if (!audioCtx || times < 1) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const fireOne = () => {
        if (!quackBuf) return;
        const src = audioCtx.createBufferSource();
        src.buffer = quackBuf;
        const gain = audioCtx.createGain();
        gain.gain.value = QUACK_VOLUME;
        src.connect(gain).connect(audioCtx.destination);
        src.start();
      };
      const run = () => {
        for (let i = 0; i < times; i++) setTimeout(fireOne, i * QUACK_STAGGER);
      };
      if (quackBuf) run();
      else if (quackLoading) quackLoading.then(run);
    }

    // ============ 聊天室 ============

    const chatPanel = document.getElementById('chatPanel');
    const chatLog = document.getElementById('chatLog');
    const chatInput = document.getElementById('chatInput');
    const chatText = document.getElementById('chatText');
    const chatSend = document.getElementById('chatSend');

    const CHAT_KEY = 'debugduck.chat';
    const THINK_MS = 3000;

    // --- 聊天室位置：輸入框在鴨頭上 50px，聊天室疊在輸入框上面 ---
    function layoutChat() {
      const top = duck.getBoundingClientRect().top;          // #duck 外層不受起伏動畫影響
      const inputBottom = window.innerHeight - top + 50;      // 輸入框底邊 = 鴨頭頂 - 50px
      chatInput.style.bottom = inputBottom + 'px';
      chatPanel.style.bottom = (inputBottom + chatInput.offsetHeight + 10) + 'px';
    }
    window.addEventListener('resize', layoutChat);
    window.addEventListener('load', layoutChat);
    requestAnimationFrame(layoutChat);

    // --- 鴨子的回應邏輯（對應 DuckBrain.cs：5 種台詞） ---
    const QUACKS = ['嘎', '嘎嘎', '嘎嘎嘎'];
    let lastQuack = '';
    function respond(input) {
      const text = (input || '').trim();
      const lower = text.toLowerCase();
      const has = (arr) => arr.some((n) => lower.includes(n));
      if (has(['解決', '搞定', '找到了', '原來', '懂了', '是這個',
               'fixed', 'solved', 'got it', 'works now', 'nailed it'])) return '!';
      if (text.length === 0 || text.includes('?') || text.includes('？') ||
          has(['為什麼', '為何', '怎麼', '怎會', 'how', 'why', 'what'])) return '?';
      let q = QUACKS[Math.random() * QUACKS.length | 0];
      if (q === lastQuack) q = QUACKS[(QUACKS.indexOf(q) + 1) % QUACKS.length];
      lastQuack = q;
      return q;
    }

    // --- 紀錄（存 localStorage，重整不消失；「思考中..」不會進來） ---
    const loadChat = () => { try { return JSON.parse(localStorage.getItem(CHAT_KEY) || '[]'); } catch { return []; } };
    const saveChat = (a) => { try { localStorage.setItem(CHAT_KEY, JSON.stringify(a)); } catch {} };

    function scrollToBottom() { chatLog.scrollTop = chatLog.scrollHeight; }

    const fmtTime = (d) => {
      const p = (n) => String(n).padStart(2, '0');
      return p(d.getHours()) + ':' + p(d.getMinutes());
    };

    // opts: { thinking?: bool, time?: string }  —— time 省略就用現在時間；「思考中..」不加時間
    function addMsg(who, text, opts) {
      opts = opts || {};
      const wrap = document.createElement('div');
      wrap.className = 'msg-wrap ' + who + (opts.thinking ? ' thinking' : '');

      const bubble = document.createElement('div');
      bubble.className = 'msg';
      bubble.textContent = text;
      wrap.appendChild(bubble);

      if (!opts.thinking) {
        const stamp = 'time' in opts ? opts.time : fmtTime(new Date());
        if (stamp) {
          const t = document.createElement('div');
          t.className = 'msg-time';
          t.textContent = stamp;
          wrap.appendChild(t);
        }
      }

      chatLog.appendChild(wrap);
      scrollToBottom();
      return wrap;
    }

    function pushChat(who, text) {
      const c = loadChat();
      c.push({ who, text, t: fmtTime(new Date()) });
      saveChat(c);
    }

    // 開場：把已存的紀錄畫出來（用當時存下的時間戳記）
    loadChat().forEach((m) => addMsg(m.who, m.text, { time: m.t || '' }));
    scrollToBottom();

    let busy = false;
    function setBusy(b) {
      busy = b;
      chatText.disabled = b;
      chatSend.disabled = b;
      chatInput.classList.toggle('busy', b);
      if (!b) chatText.focus();
    }

    function send() {
      if (busy) return;
      const text = chatText.value.trim();
      if (!text) return;
      chatText.value = '';

      pushChat('player', text);
      addMsg('player', text);

      setBusy(true);
      initSound();   // 送出是使用者手勢，趁機解鎖音訊
      const thinking = addMsg('duck', '思考中..', { thinking: true });   // 暫時泡泡，不進紀錄、不加時間
      const reply = respond(text);

      setTimeout(() => {
        thinking.remove();
        pushChat('duck', reply);
        addMsg('duck', reply);
        playQuacks(reply.length);   // 按字數叫（嘎嘎→2、嘎嘎嘎→3、其餘→1）
        setBusy(false);
      }, THINK_MS);
    }

    chatSend.addEventListener('click', send);
    chatText.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
  </script>

</body>
</html>
